
name: SonarQube Cloud Analysis

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  sonarcloud:
    name: Analisis estatico NodeGoat
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analisis SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=gramirezc5-bit_NodeGoat
            -Dsonar.organization=gramirezc5-bit
            -Dsonar.sources=.

